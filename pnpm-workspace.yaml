# Keep the plugin's dependency store local to this checkout so `pnpm install`
# never touches a shared store, and let native build scripts run if a
# dependency needs one (node-gyp etc.).
packages:
  - '.'

peerDependencyRules:
  ignoreMissing:
    - '@deepseek-ai/*'

overrides:
  '@deepseek-ai/dsh-session': '0.1.2-rc.1'
  '@deepseek-ai/dsh-invariants': '0.1.2-rc.1'
  '@deepseek-ai/dsh-scope': '0.1.2-rc.1'
  '@deepseek-ai/dsh-llm': '0.1.2-rc.1'
  '@deepseek-ai/dsh-timeout': '0.1.2-rc.1'
  '@deepseek-ai/dsh-typert-protocol': '0.1.2-rc.1'
