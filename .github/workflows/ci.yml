name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Install latest Moli (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/moli-install
          curl -sL https://github.com/lexmount/moli/releases/latest/download/moli-x86_64-unknown-linux-gnu.tar.gz | tar -xz --strip-components=1 -C /tmp/moli-install
          sudo mv /tmp/moli-install/moli /usr/local/bin/moli
          rm -rf /tmp/moli-install
          moli --version

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Tarball content check is platform-independent; /tmp + tar + grep
      # piping assumes a POSIX shell, so it stays on the Linux runners.
      - name: Verify package contents
        if: matrix.os == 'ubuntu-latest'
        run: pnpm pack --pack-destination /tmp/dsh-web-fetch-moli-pack && tar -tzf /tmp/dsh-web-fetch-moli-pack/*.tgz | grep -q '^package/lib/index.js$' || (echo 'lib/index.js missing from package' && exit 1)
