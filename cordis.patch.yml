# dsh-web-fetch-moli bundle layer (targets deepseek-harness >= 0.2.2-rc.5).
#
# 1. Pin the web seam's fetch provider to this plugin's provider (id 'moli').
#    In dsh >= 0.2.2-rc.5, the base layer omits `searchProvider` so `dsh-web`
#    can auto-select the right search provider per LLM route; omit it here too
#    so this bundle never overrides route-aware search selection.
# 2. Do not re-enable host-plane `tool-web`: in dsh >= 0.2.2-rc.5, `base` and
#    the `web-app` presets (`standard`, `ptc`, `cordis`) already enable
#    `fetch: true`, while `minimal` intentionally omits `tool-web`. This plugin
#    raises `web_fetch`'s tool timeout dynamically per agent on `tools/execute`.
# 3. Insert this package's host plugin row using schema defaults.
#
# Bundle layers load at the next profile start; the settings section
# ('web-fetch-moli') layering over the row config is hot-reloaded.
- id: web
  config:
    fetchProvider: moli

- insert:
    - id: web-fetch-moli
      name: dsh-web-fetch-moli
